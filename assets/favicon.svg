<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Left Wing Teal Gradient -->
    <linearGradient id="elytraTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3A1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>

    <!-- Right Wing Blue Gradient -->
    <linearGradient id="elytraBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077C8"/>
      <stop offset="100%" stop-color="#0D2451"/>
    </linearGradient>

    <!-- Center Spine Gradient -->
    <linearGradient id="elytraSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A3A1"/>
      <stop offset="50%" stop-color="#0077C8"/>
      <stop offset="100%" stop-color="#0D2451" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A3A1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g transform="translate(200, 200)" filter="url(#subtleGlow)">
    <!-- LEFT WING (TEAL) -->
    <!-- Outer Arch & Base -->
    <path d="M -8, -130 
             C -60, -90 -165, -10 -170, 70 
             C -130, 115 -50, 110 -12, 85 
             C -65, 80 -125, 60 -138, 30 
             C -130, -20 -60, -80 -8, -130 Z" 
          fill="url(#elytraTeal)"/>

    <!-- Left Inner Curved Feather Arc -->
    <path d="M -15, -40 
             C -65, -10 -115, 25 -145, 55 
             C -105, 30 -55, 10 -12, 10 Z" 
          fill="url(#elytraTeal)"/>

    <!-- RIGHT WING (BLUE) -->
    <!-- Outer Arch & Base -->
    <path d="M 8, -130 
             C 60, -90 165, -10 170, 70 
             C 130, 115 50, 110 12, 85 
             C 65, 80 125, 60 138, 30 
             C 130, -20 60, -80 8, -130 Z" 
          fill="url(#elytraBlue)"/>

    <!-- Right Inner Curved Feather Arc -->
    <path d="M 15, -40 
             C 65, -10 115, 25 145, 55 
             C 105, 30 55, 10 12, 10 Z" 
          fill="url(#elytraBlue)"/>

    <!-- CENTER VERTICAL SPINE -->
    <path d="M -3, -135 L 3, -135 L 2, 95 L -2, 95 Z" 
          fill="url(#elytraSpine)" rx="2"/>
  </g>
</svg>
